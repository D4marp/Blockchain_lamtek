name: Backend API CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/ci-backend.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: lamtek_test
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
        ports:
          - 3306:3306
      
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
        ports:
          - 6379:6379
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: backend/package.json
      
      - name: Install dependencies
        working-directory: backend
        run: npm install
      
      - name: Build TypeScript
        working-directory: backend
        run: npm run build
        continue-on-error: true
      
      - name: Lint code
        working-directory: backend
        run: npm run lint
        continue-on-error: true
      
      - name: Type check
        working-directory: backend
        run: npx tsc --noEmit
        continue-on-error: true
      
      - name: Run unit tests
        working-directory: backend
        env:
          DATABASE_URL: mysql://root:root@localhost:3306/lamtek_test
          REDIS_URL: redis://localhost:6379
          BESU_RPC_URL: http://localhost:8545
          IPFS_API_URL: http://localhost:5001
        run: npm test
        continue-on-error: true

  docker-build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Build Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: lamtek-api:test

  security-scan:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Run dependency audit
        working-directory: backend
        run: npm audit --audit-level=moderate
        continue-on-error: true
      
      - name: Setup OWASP dependency check
        run: |
          wget https://github.com/jeremylong/DependencyCheck_CI/releases/download/9.0.7/dependency-check_9.0.7_linux_x64.sh
          chmod +x dependency-check_9.0.7_linux_x64.sh
          ./dependency-check_9.0.7_linux_x64.sh || true
        continue-on-error: true
