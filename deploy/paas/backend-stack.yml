# SERVICE 3 — Backend (NestJS) + data tier (MySQL, Redis, IPFS).
# Deploy: docker stack deploy -c ... backend
# Push REGISTRY/lamtek-backend first (stack deploy ignores `build:`).
version: "3.8"

services:
  backend:
    image: ${BACKEND_IMAGE:-REGISTRY/lamtek-backend}
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ORIGINS: ${CORS_ORIGINS}
      # Database
      DATABASE_URL: ${DATABASE_URL}
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_USERNAME: ${DB_USERNAME:-lamtek}
      DB_PASSWORD: ${DB_PASSWORD:-lamtek123}
      DB_DATABASE: ${DB_DATABASE:-lamtek_db}
      SEED_ON_STARTUP: ${SEED_ON_STARTUP:-true}
      # Skema dari MIGRATION (docker-start.sh menjalankan migration:run). false.
      TYPEORM_SYNCHRONIZE: ${TYPEORM_SYNCHRONIZE:-false}
      # Redis
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      # JWT
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      # Blockchain (SERVICE 1)
      BESU_RPC_URL: ${BESU_RPC_URL:-http://blockchain:8545}
      BESU_WS_URL: ${BESU_WS_URL:-ws://blockchain:8546}
      SIGNER_MODE: ${SIGNER_MODE:-external}
      EXTERNAL_SIGNER_RPC_URL: ${EXTERNAL_SIGNER_RPC_URL:-http://blockchain:8545}
      EXTERNAL_SIGNER_ADDRESS: ${EXTERNAL_SIGNER_ADDRESS:-}
      AKREDITASI_CONTRACT_ADDRESS: ${AKREDITASI_CONTRACT_ADDRESS}
      ASESMEN_KECUKUPAN_CONTRACT_ADDRESS: ${ASESMEN_KECUKUPAN_CONTRACT_ADDRESS}
      ASESMEN_LAPANGAN_CONTRACT_ADDRESS: ${ASESMEN_LAPANGAN_CONTRACT_ADDRESS}
      DOKUMEN_IPFS_CONTRACT_ADDRESS: ${DOKUMEN_IPFS_CONTRACT_ADDRESS}
      # Kafka (SERVICE 2)
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:9092}
      KAFKA_CLIENT_ID: ${KAFKA_CLIENT_ID:-lamtek-backend}
      KAFKA_GROUP_ID: ${KAFKA_GROUP_ID:-lamtek-consumer-group}
      KAFKA_CONSUMER_CLIENT_ID: ${KAFKA_CONSUMER_CLIENT_ID:-lamtek-backend-consumer}
      KAFKA_CONSUMER_GROUP_ID: ${KAFKA_CONSUMER_GROUP_ID:-lamtek-consumer-runtime-group}
      DATA_FILE_WORKFLOW_MODE: ${DATA_FILE_WORKFLOW_MODE:-kafka}
      # IPFS
      IPFS_API_URL: ${IPFS_API_URL:-http://blockchain:5001}
      IPFS_GATEWAY_URL: ${IPFS_GATEWAY_URL:-http://blockchain:8080}
    ports:
      - "3001:3000"
    networks:
      - lamtek-net
    deploy:
      replicas: 1
      restart_policy:
        condition: any

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_DATABASE:-lamtek_db}
      MYSQL_USER: ${DB_USERNAME:-lamtek}
      MYSQL_PASSWORD: ${DB_PASSWORD:-lamtek123}
    volumes:
      - mysql_data:/var/lib/mysql
      # TIDAK mount database/init — skema dibangun TypeORM (TYPEORM_SYNCHRONIZE=true).
    networks:
      - lamtek-net
    deploy:
      replicas: 1
      restart_policy:
        condition: any

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    networks:
      - lamtek-net
    deploy:
      replicas: 1
      restart_policy:
        condition: any

  # IPFS digabung ke service "blockchain" (lihat blockchain/stack.yml).

networks:
  lamtek-net:
    external: true

volumes:
  mysql_data:
  redis_data:
