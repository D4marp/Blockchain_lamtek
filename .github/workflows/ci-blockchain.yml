name: Blockchain CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - 'blockchain/**'
      - '.github/workflows/ci-blockchain.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'blockchain/**'

jobs:
  test-contracts:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: blockchain/package.json
      
      - name: Install dependencies
        working-directory: blockchain
        run: npm install
      
      - name: Compile smart contracts
        working-directory: blockchain
        run: npm run compile
      
      - name: Run tests
        working-directory: blockchain
        run: npm test
        continue-on-error: true
      
      - name: Check contract syntax
        working-directory: blockchain
        run: npx hardhat compile --force
      
      - name: Generate gas report
        working-directory: blockchain
        run: npm run test 2>&1 | tee gas-report.txt
        continue-on-error: true
      
      - name: Upload gas report
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: gas-report
          path: blockchain/gas-report.txt

  security-audit:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Install Slither
        run: |
          pip install slither-analyzer
      
      - name: Run Slither security analysis
        working-directory: blockchain/contracts
        run: slither . --json slither-report.json || true
        continue-on-error: true
      
      - name: Upload Slither report
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: slither-report
          path: blockchain/contracts/slither-report.json

  code-quality:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: blockchain/package.json
      
      - name: Install dependencies
        working-directory: blockchain
        run: npm install
      
      - name: Lint contracts
        working-directory: blockchain
        run: npx hardhat compile --force
        continue-on-error: true
      
      - name: Check code formatting
        run: |
          npm install -g prettier
          prettier --check blockchain/contracts/**/*.sol blockchain/scripts/**/*.js || true
        continue-on-error: true
