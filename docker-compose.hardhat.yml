# ============================================
# HARDHAT TEST RUNNER - Docker Compose
# ============================================
#
# Runs Hardhat smart contract tests in isolation
# with proper Node.js environment

version: '3.9'

services:
  # ============================================
  # Hardhat Blockchain Testing
  # ============================================
  hardhat-test:
    build:
      context: ./blockchain
      dockerfile: Dockerfile
    container_name: lamtek-hardhat-test
    environment:
      - NODE_ENV=test
      - NODE_OPTIONS=--max-old-space-size=4096
    volumes:
      - ./blockchain:/app
      - /app/node_modules
      - /app/artifacts
      - /app/cache
    working_dir: /app
    # Run Hardhat tests
    command: >
      sh -c "
        npm ci &&
        npx hardhat compile &&
        npx hardhat test
      "
    networks:
      - lamtek-test-network

  # ============================================
  # Hardhat Local Node (Optional)
  # ============================================
  hardhat-node:
    build:
      context: ./blockchain
      dockerfile: Dockerfile
    container_name: lamtek-hardhat-node
    environment:
      - NODE_ENV=development
    volumes:
      - ./blockchain:/app
      - /app/node_modules
    working_dir: /app
    ports:
      - "8545:8545"
      - "8546:8546"
    command: >
      sh -c "
        npm ci &&
        npx hardhat compile &&
        npx hardhat node --hostname 0.0.0.0 --port 8545
      "
    networks:
      - lamtek-test-network
    profiles:
      - node  # Only run with --profile node

networks:
  lamtek-test-network:
    driver: bridge
